name: Atualizar estatísticas do README

on:
  schedule:
    - cron: "17 9 * * *" # todo dia, 05:17 em Cuiabá
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/gerar-stats.py
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: readme-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools==4.55.3
      - name: Gerar cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gerar-stats.py "${{ github.repository_owner }}" assets/readme
      - name: Salvar se mudou
        run: |
          git add assets/readme/stats-*.svg
          if git diff --cached --quiet; then echo "Sem mudanças."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualiza estatísticas do README"
          git push
